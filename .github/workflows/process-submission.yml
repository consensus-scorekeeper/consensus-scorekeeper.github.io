# Turns "Submit game results" issues (the submit-results.yml issue form)
# into reviewable PRs. scripts/process-submission.mjs validates the CSVs
# and writes them into tournaments/<slug>/results/ in the checkout; this
# workflow commits the working-tree changes to a per-issue branch, opens
# (or updates) a PR, and reports back on the issue.
#
# Runs on `edited` too, so a submitter can fix a rejected submission by
# editing the issue — the same branch/PR is force-updated each time.
#
# Safety: the issue body is untrusted. The script only ever writes
# sanitized filenames under a registry-validated tournament slug, all
# untrusted text reaches the shell via --body-file, and merging the PR is
# a manual maintainer review step.

name: Process results submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'results-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and stage submitted CSVs
        id: process
        env:
          # The submit-relay Worker's bot login — issues it authored are
          # eligible for key-verified auto-publish (docs/submission-relay.md).
          RELAY_BOT_LOGIN: ${{ vars.RELAY_BOT_LOGIN || 'consensus-submit-relay[bot]' }}
        run: node scripts/process-submission.mjs

      - name: Create or update submission PR
        id: pr
        if: steps.process.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLUG: ${{ steps.process.outputs.slug }}
        run: |
          BRANCH="submission/issue-$ISSUE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          # roster-presets.js is included because new-tournament
          # submissions append a registry entry to it.
          git add tournaments src/ui/roster-presets.js
          if git diff --cached --quiet; then
            echo "No changes — submitted games are identical to what's already published."
            echo "pr_note=No changes: every submitted game is already published with identical stats." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add submitted results from #$ISSUE"
          git push -f origin "$BRANCH"
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[].url' | head -n 1)
          if [ -z "$PR_URL" ]; then
            printf 'Results submitted via #%s.\n\nCloses #%s\n' "$ISSUE" "$ISSUE" > "$RUNNER_TEMP/pr-body.md"
            # On failure, surface gh's actual error in the issue comment —
            # PR creation is the step most often blocked by org/repo
            # Actions settings, and the submitter can't read run logs.
            if ! PR_URL=$(gh pr create --head "$BRANCH" \
                --title "Results submission (#$ISSUE)" \
                --body-file "$RUNNER_TEMP/pr-body.md" 2> "$RUNNER_TEMP/gh-error.txt"); then
              {
                echo 'pr_note<<PR_NOTE_EOF'
                echo "⚠️ The games validated and branch \`$BRANCH\` was pushed, but opening the PR failed:"
                echo '```'
                cat "$RUNNER_TEMP/gh-error.txt"
                echo '```'
                echo 'A maintainer can open the PR from that branch manually, or fix the setting and re-run the failed job.'
                echo 'PR_NOTE_EOF'
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          # A rejected submission's issue is closed by finalize-submission.yml
          # when its PR is closed unmerged; an edit that produced this fresh
          # PR is a live submission again, so bring the issue back with it.
          if [ "$(gh issue view "$ISSUE" --json state --jq .state)" = "CLOSED" ]; then
            gh issue reopen "$ISSUE"
          fi
          # tournaments/preview.html renders these stats straight from the
          # submission branch, so submitters see them before the PR merges.
          PREVIEW_URL="https://consensus-scorekeeper.github.io/tournaments/preview.html?slug=$SLUG&preview=$ISSUE"
          {
            echo 'pr_note<<PR_NOTE_EOF'
            echo "Opened/updated PR for review: $PR_URL"
            echo ''
            echo "📊 [**Preview these stats now**]($PREVIEW_URL) — no need to wait for the merge. The preview always shows this submission's latest validated version; once merged, the games appear on the tournament's own stats page."
            echo 'PR_NOTE_EOF'
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      # Key-verified auto-publish (docs/submission-relay.md). The script
      # only NOMINATES (verified=true when the relay bot authored the
      # issue with a matching stamp); the actual gate is here — the diff
      # wall: every file the PR changes must live in this slug's results
      # folder. A verified NEW-tournament submission (possible only with
      # a maintainer-pre-minted key — Worker-minted fresh-slug keys stay
      # pending until a human merge) widens the wall to exactly the
      # creation file set: the registry entry (JSON-serialized, so
      # injection-safe) and the slug's generated index.html. Anything
      # else code-shaped still drops to manual review. The manifest is
      # regenerated INTO the branch because a GITHUB_TOKEN merge won't
      # trigger update-manifest.yml — with it, stats go live at the merge.
      # Same reason finalize-submission.yml won't fire: the 🎉/close
      # happens inline.
      - name: Auto-publish verified submission
        if: >-
          steps.process.outputs.status == 'ok' &&
          steps.process.outputs.verified == 'true' &&
          steps.pr.outputs.pr_url != ''
        id: auto
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLUG: ${{ steps.process.outputs.slug }}
          NEW_TOURNAMENT: ${{ steps.process.outputs.new_tournament }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          BRANCH="submission/issue-$ISSUE"
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if [ "$NEW_TOURNAMENT" = "true" ]; then
            OUTSIDE=$(printf '%s\n' "$CHANGED" | grep -Ev "^tournaments/$SLUG/results/|^tournaments/$SLUG/index\.html$|^src/ui/roster-presets\.js$" || true)
          else
            OUTSIDE=$(printf '%s\n' "$CHANGED" | grep -v "^tournaments/$SLUG/results/" || true)
          fi
          if [ -n "$OUTSIDE" ]; then
            {
              echo 'auto_note<<AUTO_NOTE_EOF'
              echo '🔑 The publishing key checked out, but this submission changes files outside the tournament'\''s results folder, so it needs a maintainer merge:'
              echo '```'
              echo "$OUTSIDE"
              echo '```'
              echo 'AUTO_NOTE_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/update_manifests.py
          if [ -n "$(git status --porcelain "tournaments/$SLUG/results")" ]; then
            git add "tournaments/$SLUG/results"
            git commit -m "Regenerate manifest for auto-published submission #$ISSUE"
            git push origin "$BRANCH"
          fi

          if ! gh pr merge "$PR_URL" --squash --delete-branch 2> merge-error.txt; then
            {
              echo 'auto_note<<AUTO_NOTE_EOF'
              echo '⚠️ The publishing key checked out but the automatic merge failed — a maintainer will publish this manually:'
              echo '```'
              cat merge-error.txt
              echo '```'
              echo 'AUTO_NOTE_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATS_URL="https://consensus-scorekeeper.github.io/tournaments/$SLUG/"
          {
            echo 'auto_note<<AUTO_NOTE_EOF'
            echo "🎉 **Published automatically** (verified publishing key): $STATS_URL"
            echo ''
            echo '(If the games are not visible yet, give the site a couple of minutes to redeploy.)'
            echo 'AUTO_NOTE_EOF'
          } >> "$GITHUB_OUTPUT"
          gh issue close "$ISSUE" --reason completed || true

      - name: Report back on the issue
        if: always() && steps.process.outputs.status != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PR_NOTE: ${{ steps.pr.outputs.pr_note }}
          AUTO_NOTE: ${{ steps.auto.outputs.auto_note }}
        run: |
          if [ -n "$PR_NOTE" ]; then
            printf '\n%s\n' "$PR_NOTE" >> "$RUNNER_TEMP/summary.md"
          fi
          if [ -n "$AUTO_NOTE" ]; then
            printf '\n%s\n' "$AUTO_NOTE" >> "$RUNNER_TEMP/summary.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/summary.md"
